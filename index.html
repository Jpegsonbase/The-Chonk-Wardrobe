<body>

<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">DAILY CHONK</div>
      <h1>CHONK 30000</h1>
    </div>

    <div class="tag">
      LIVE • ONCHAIN
    </div>
  </header>


  <main>

    <section class="card chonk-card">

      <div id="loading" class="loading">
        Fetching Chonk 30000…
      </div>

        <img
          id="chonk-image"
          alt="Chonk #30000"

        />
      </div>

    </section>

      <section class="card timer-card">

        <div class="label">

        </div>

        <div id="countdown">
          24:00:00
        </div>

        <div class="progress">
          <div id="progress"></div>
        </div>

        <div id="status" class="status">
          Waiting for the wardrobe clock…
        </div>

      </section>


      <section class="card details">

        <h2>Today's fit</h2>

        <div id="traits" class="traits">

          <div class="trait">
            <span>Status</span>
            <span>Loading…</span>
          </div>

        </div>

      </section>

    </aside>

  </main>


  <footer>

    <span>
      Chonk #30000 is read directly from the Base blockchain.
    </span>

      <a
        href="https://www.chonks.xyz/chonks/30000"
        target="_blank"
        rel="noopener"
      >
        Open on Chonks ↗
      </a>

      <a
        href="https://x.com/jpegsonbase"
        target="_blank"
        rel="noopener"
      >
        Twitter / X ↗
      </a>

    </div>

  </footer>

</div>


<script>
(() => {

  const CHONK_ID = 30000;

  const CONTRACT =
    "0x07152bfde079b5319e5308c43fb1dbc9c76cb4f9";

  const RPC =
    "https://mainnet.base.org";


  /*
    Set this to the exact timestamp when your bot
    last changed the outfit.

    The site counts down in 24-hour cycles.
  */

  const LAST_CHANGE =
    Date.parse("2026-09-07T00:00:00Z");

  const CYCLE =
    24 * 60 * 60 * 1000;


  const abi = [
    "function tokenURI(uint256) view returns (string)",
    "function renderAsDataUri2D(uint256) view returns (string)"
  ];


  const provider =
    new ethers.JsonRpcProvider(RPC);


  const contract =
    new ethers.Contract(
      CONTRACT,
      abi,
      provider
    );


  const image =
    document.getElementById("chonk-image");

  const loading =
    document.getElementById("loading");

  const traitsEl =
    document.getElementById("traits");

  const countdownEl =
    document.getElementById("countdown");

  const progressEl =
    document.getElementById("progress");

  const statusEl =
    document.getElementById("status");


  function decodeDataUri(uri) {

    if (!uri.startsWith("data:")) {
      return uri;
    }

    const comma =
      uri.indexOf(",");

    const meta =
      uri.slice(0, comma);

    const data =
      uri.slice(comma + 1);

    return meta.includes(";base64")
      ? atob(data)
      : decodeURIComponent(data);
  }


  function showTraits(json) {

    traitsEl.innerHTML = "";

    const attrs =
      Array.isArray(json.attributes)
        ? json.attributes
        : [];


    if (!attrs.length) {

      traitsEl.innerHTML =
        '<div class="trait">' +
        '<span>Metadata</span>' +
        '<span>Onchain</span>' +
        '</div>';

      return;
    }


    attrs.forEach(a => {

      const row =
        document.createElement("div");

      row.className =
        "trait";


      row.innerHTML =
        `<span>${escapeHtml(
          a.trait_type ?? "Trait"
        )}</span>
        <span>${escapeHtml(
          String(a.value ?? "—")
        )}</span>`;


      traitsEl.appendChild(row);

    });

  }


  function escapeHtml(s) {

    return s.replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[c])
    );

  }


  async function loadChonk() {

    try {

      const [uri, svgUri] =
        await Promise.all([

          contract.tokenURI(
            CHONK_ID
          ),

          contract.renderAsDataUri2D(
            CHONK_ID
          )

        ]);


      /*
        Prefer the forced 2D render.
      */

      const sourceUri =
        svgUri || uri;


      let metadata = {};
      let imageUri = null;


      try {

        const decoded =
          decodeDataUri(sourceUri);

        metadata =
          JSON.parse(decoded);

        imageUri =
          metadata.image || null;

      } catch (_) {

        if (
          sourceUri.startsWith(
            "data:image"
          )
        ) {

          imageUri =
            sourceUri;

        }

      }


      if (imageUri) {

        image.src =
          imageUri;

        image.hidden =
          false;

        loading.hidden =
          true;

      } else {

        throw new Error(
          "No image found in on-chain metadata"
        );

      }


      showTraits(metadata);


      statusEl.textContent =
        "Live — checking the chain every 60 seconds.";


    } catch (err) {

      console.error(err);


      loading.textContent =
        "Couldn't load Chonk 30000.";


      statusEl.textContent =
        "Check the browser console and your RPC connection.";


      traitsEl.innerHTML =
        '<div class="error">' +
        'The blockchain request failed. ' +
        'Try again in a moment.' +
        '</div>';

    }

  }


  function tick() {

    const now =
      Date.now();


    let elapsed =
      (now - LAST_CHANGE) % CYCLE;


    if (elapsed < 0) {
      elapsed += CYCLE;
    }


    const remaining =
      CYCLE - elapsed;


    const h =
      Math.floor(
        remaining / 3600000
      );


    const m =
      Math.floor(
        (remaining % 3600000) / 60000
      );


    const s =
      Math.floor(
        (remaining % 60000) / 1000
      );


    countdownEl.textContent =
      `${String(h).padStart(2,"0")}:` +
      `${String(m).padStart(2,"0")}:` +
      `${String(s).padStart(2,"0")}`;


    const pct =
      (elapsed / CYCLE) * 100;


    progressEl.style.width =
      `${pct}%`;


    statusEl.textContent =
      remaining < 60000
        ? "Wardrobe change imminent…"
        : "Next outfit change is on the clock.";

  }


  /*
    Initial load
  */

  loadChonk();

  tick();


  /*
    Update countdown every second
  */

  setInterval(
    tick,
    1000
  );


  /*
    Re-read the blockchain every 60 seconds
    so the new outfit appears automatically.
  */

  setInterval(
    loadChonk,
    60000
  );

})();
</script>

</body>
